name: Validate and deploy Python CSTUHubAuth

on:
  pull_request:
    branches: [main]
    paths: ['backend/**', '.github/workflows/deploy-python-auth.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/deploy-python-auth.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-python-auth-ap-southeast-2
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend/tests -v

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.LAMBDA_DEPLOYMENT_PAUSED != 'true' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-2
      AWS_DEFAULT_REGION: ap-southeast-2
      AWS_PAGER: ''
      LAMBDA_FUNCTION: CSTUHubAuth
      # Same HTTPS origin as the frontend; no API Gateway hostname fallback.
      API_ORIGIN: ${{ vars.CSTUHUB_API_ORIGIN }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the Free Tier role and API origin
        run: |
          set -euo pipefail
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$API_ORIGIN"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
          allowed-account-ids: '781485979426'
          mask-aws-account-id: true
          unset-current-credentials: true
          retry-max-attempts: 2
      - name: Require current main and read existing configuration privately
        id: config
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          aws lambda wait function-updated-v2 --function-name "$LAMBDA_FUNCTION"
          aws lambda get-function-configuration --function-name "$LAMBDA_FUNCTION" \
            --output json > "$RUNNER_TEMP/auth-config.json"
          chmod 600 "$RUNNER_TEMP/auth-config.json"
          python3 <<'PY'
          import json, os
          from pathlib import Path
          c = json.loads(Path(os.environ['RUNNER_TEMP'], 'auth-config.json').read_text())
          if (c.get('Runtime') != 'python3.12' or c.get('PackageType') != 'Zip'
                  or c.get('Handler') != 'backend.lambda_function.handler'
                  or c.get('Layers') or not c.get('RevisionId')):
              raise SystemExit('Require Python 3.12 Zip, backend.lambda_function.handler, no layers and revision')
          architectures = c.get('Architectures')
          platforms = {'x86_64': 'manylinux2014_x86_64', 'arm64': 'manylinux2014_aarch64'}
          if not architectures or len(architectures) != 1 or architectures[0] not in platforms:
              raise SystemExit('Unsupported architecture')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('platform=' + platforms[architectures[0]] + '\n')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install complete production dependencies for the existing architecture
        env:
          TARGET_PLATFORM: ${{ steps.config.outputs.platform }}
        run: |
          python -m pip install -r backend/requirements.txt --target "$RUNNER_TEMP/auth-package" \
            --platform "$TARGET_PLATFORM" --implementation cp --python-version 3.12 --only-binary=:all: --no-compile
          python -m pip install -r backend/requirements.txt
      - name: Validate existing auth, business and private storage configuration
        run: |
          python <<'PY'
          import base64, json, os
          from pathlib import Path
          from urllib.parse import urlsplit
          import boto3
          c = json.loads(Path(os.environ['RUNNER_TEMP'], 'auth-config.json').read_text())
          e = c.get('Environment', {}).get('Variables', {})
          required = ('SESSION_TABLE', 'USER_TABLE', 'IDENTITY_TABLE', 'LOGIN_RATE_TABLE', 'PARTNER_TABLE',
                      'BUSINESS_TABLE', 'DOCUMENT_BUCKET', 'SESSION_ORIGIN', 'STUDENT_SCOPE_ID',
                      'SESSION_CSRF_SECRET', 'IDENTITY_HMAC_SECRET')
          if any(not e.get(k) for k in required) or e.get('AUTH_V3_ENABLED') != 'true':
              raise SystemExit('Required auth/business/storage configuration missing or V3 disabled')
          origin = os.environ['API_ORIGIN']
          u = urlsplit(origin)
          if (u.scheme != 'https' or not u.hostname or u.username or u.password
                  or u.path or u.query or u.fragment or origin != e['SESSION_ORIGIN']):
              raise SystemExit('CSTUHUB_API_ORIGIN must equal SESSION_ORIGIN and be a bare HTTPS origin')
          for key in ('SESSION_CSRF_SECRET', 'IDENTITY_HMAC_SECRET'):
              if len(base64.b64decode(e[key], validate=True)) < 32:
                  raise SystemExit('Secret must decode to at least 32 bytes')
          tables = {'SESSION_TABLE': 'tokenHash', 'USER_TABLE': 'id',
                    'IDENTITY_TABLE': 'subjectKey', 'LOGIN_RATE_TABLE': 'key', 'BUSINESS_TABLE': 'id'}
          if len({e[k] for k in tables}) != len(tables):
              raise SystemExit('Auth and business tables must be separate')
          db = boto3.client('dynamodb')
          for key, partition in tables.items():
              t = db.describe_table(TableName=e[key])['Table']
              if (t['TableStatus'] != 'ACTIVE' or t['KeySchema'] != [{'AttributeName': partition, 'KeyType': 'HASH'}]
                      or {a['AttributeName']: a['AttributeType'] for a in t['AttributeDefinitions']}.get(partition) != 'S'):
                  raise SystemExit('Incorrect table schema/status: ' + key)
              if key == 'BUSINESS_TABLE':
                  index = next((i for i in t.get('GlobalSecondaryIndexes', [])
                                if i['IndexName'] == e.get('BUSINESS_SCOPE_INDEX', 'scope-entity-id')), None)
                  expected = {('scopeEntity', 'HASH'), ('id', 'RANGE')}
                  if (not index or index['IndexStatus'] != 'ACTIVE'
                          or {(k['AttributeName'], k['KeyType']) for k in index['KeySchema']} != expected
                          or index['Projection']['ProjectionType'] != 'KEYS_ONLY'
                          or not any(a == {'AttributeName': 'scopeEntity', 'AttributeType': 'S'} for a in t['AttributeDefinitions'])):
                      raise SystemExit('Business scope index is missing or incompatible')
              ttl_key = {'SESSION_TABLE': 'ttl', 'LOGIN_RATE_TABLE': 'expiresAt', 'BUSINESS_TABLE': 'ttl'}.get(key)
              if ttl_key:
                  ttl = db.describe_time_to_live(TableName=e[key])['TimeToLiveDescription']
                  if ttl.get('TimeToLiveStatus') != 'ENABLED' or ttl.get('AttributeName') != ttl_key:
                      raise SystemExit('Required TTL not enabled: ' + key)
          if e['PARTNER_TABLE'] in {e[key] for key in tables}:
              raise SystemExit('Partner table must remain separate from auth and business tables')
          partner = db.describe_table(TableName=e['PARTNER_TABLE'])['Table']
          expected_partner_keys = [{'AttributeName': 'id', 'KeyType': 'HASH'},
                                   {'AttributeName': 'type', 'KeyType': 'RANGE'}]
          partner_attributes = {a['AttributeName']: a['AttributeType'] for a in partner['AttributeDefinitions']}
          if (partner['TableStatus'] != 'ACTIVE' or partner['KeySchema'] != expected_partner_keys
                  or partner_attributes.get('id') != 'S' or partner_attributes.get('type') != 'S'):
              raise SystemExit('Incorrect Partner table schema/status: PARTNER_TABLE')
          s3 = boto3.client('s3')
          region = s3.get_bucket_location(Bucket=e['DOCUMENT_BUCKET'])['LocationConstraint'] or os.environ['AWS_REGION']
          if region != os.environ['AWS_REGION']:
              raise SystemExit('Document bucket must be in the Lambda region')
          block = s3.get_public_access_block(Bucket=e['DOCUMENT_BUCKET'])['PublicAccessBlockConfiguration']
          if not all(block.get(k) is True for k in ('BlockPublicAcls', 'IgnorePublicAcls', 'BlockPublicPolicy', 'RestrictPublicBuckets')):
              raise SystemExit('Document bucket requires all public access blocks')
          print('Existing configuration and resource schemas verified; no resources modified')
          PY
      - name: Package tracked Python source and verify ZIP
        run: |
          python <<'PY'
          import os, subprocess, zipfile
          from pathlib import Path
          package = Path(os.environ['RUNNER_TEMP'], 'auth-package')
          for name in subprocess.check_output(['git', 'ls-files', '-z', 'backend']).decode().split('\0'):
              p = Path(name)
              if not name or p.suffix != '.py' or p.parts[1] in {'tests', 'lambda'}:
                  continue
              if p.is_symlink():
                  raise SystemExit('Symlink source is not supported')
              target = package / p
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(p.read_bytes())
          output = Path(os.environ['RUNNER_TEMP'], 'CSTUHubAuth.zip')
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as z:
              for p in sorted(package.rglob('*')):
                  if p.is_file() and '__pycache__' not in p.parts and p.suffix != '.pyc':
                      z.write(p, p.relative_to(package))
          with zipfile.ZipFile(output) as z:
              assert 'backend/lambda_function.py' in z.namelist()
              assert 'boto3/__init__.py' in z.namelist()
              assert z.testzip() is None
              assert sum(i.file_size for i in z.infolist()) < 250 * 1024 * 1024
          assert output.stat().st_size < 50 * 1024 * 1024
          PY
      - name: Update existing code with revision guard and verify checksum
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          revision=$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "auth-config.json")))["RevisionId"])')
          aws lambda update-function-code --function-name "$LAMBDA_FUNCTION" \
            --zip-file "fileb://$RUNNER_TEMP/CSTUHubAuth.zip" --revision-id "$revision" \
            --query '{CodeSha256:CodeSha256}' --output json > "$RUNNER_TEMP/auth-update.json"
          aws lambda wait function-updated-v2 --function-name "$LAMBDA_FUNCTION"
          aws lambda get-function-configuration --function-name "$LAMBDA_FUNCTION" \
            --query '{CodeSha256:CodeSha256,LastUpdateStatus:LastUpdateStatus}' \
            --output json > "$RUNNER_TEMP/auth-result.json"
          python <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          result = json.loads((temp / 'auth-result.json').read_text())
          digest = base64.b64encode(hashlib.sha256((temp / 'CSTUHubAuth.zip').read_bytes()).digest()).decode()
          assert result.get('LastUpdateStatus') == 'Successful' and result.get('CodeSha256') == digest
          PY
      - name: Verify HTTPS session API without login credentials
        run: |
          python <<'PY'
          import json, os, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          req = urllib.request.Request(os.environ['API_ORIGIN'] + '/api/auth/session', headers={'Accept': 'application/json'})
          with urllib.request.build_opener(NoRedirect()).open(req, timeout=20) as r:
              assert r.status == 200 and 'no-store' in r.headers.get('Cache-Control', '')
              assert r.headers.get_content_type() == 'application/json'
              data = json.load(r)
              assert 'user' in data and data['user'] is None and data.get('grants') == [] and data.get('capabilities') == [] and isinstance(data.get('csrfToken'), str) and data['csrfToken']
              cookies = r.headers.get_all('Set-Cookie') or []
              assert any(c.startswith('__Host-cstuhub=') and all(v in c.lower() for v in ('secure', 'httponly', 'path=/')) for c in cookies)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('CSTUHubAuth: tests, resource checks, code checksum and anonymous HTTPS session passed.\n\n')
              f.write('Commit: ' + os.environ['GITHUB_SHA'] + '\n\n')
              f.write('TU login and business/document acceptance require separate authorized checks.\n')
          PY
      - name: Remove private temporary configuration and packages
        if: always()
        run: rm -rf "$RUNNER_TEMP/auth-config.json" "$RUNNER_TEMP/auth-package" "$RUNNER_TEMP/CSTUHubAuth.zip"
