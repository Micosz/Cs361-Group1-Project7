name: Backend session tests

on:
  push:
    paths:
      - 'backend/**'
      - 'tools/mock-auth/**'
      - 'public/assets/auth*.js'
      - 'public/assets/login.js'
      - 'public/assets/workspace.js'
      - 'public/assets/script.js'
      - 'public/*.html'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tools/mock-auth/**'
      - 'public/assets/auth*.js'
      - 'public/assets/login.js'
      - 'public/assets/workspace.js'
      - 'public/assets/script.js'
      - 'public/*.html'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/backend-tests.yml'

permissions:
  contents: read

jobs:
  sessions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend/tests -v
      - name: Local mock user smoke checks
        run: python -m unittest discover -s tools/mock-auth -p 'test_*.py' -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
