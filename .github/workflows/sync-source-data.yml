name: Sync GitHub source catalog to DynamoDB

on:
  push:
    branches: [main]
    paths:
      - 'data/partners.json'
      - 'data/source-sync-config.json'
      - 'public/data/partner-data-backup.json'
      - 'scripts/build-source-backup.cjs'
      - 'scripts/sync-source-data.cjs'
      - '.github/workflows/sync-source-data.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Apply to Partner or inspect the plan only'
        type: choice
        options: [apply, dry-run]
        default: apply

permissions:
  contents: read

concurrency:
  group: source-catalog-partner-ap-southeast-2
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main' && vars.SOURCE_DATA_SYNC_PAUSED != 'true' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-2
      AWS_DEFAULT_REGION: ap-southeast-2
      AWS_PAGER: ''
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - name: Read current main (including queued runs)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate source data and sync safety
        run: |
          node scripts/build-source-backup.cjs --check
          node --test tests/source-sync.test.cjs
      - name: Require the Free Tier deployment role
        run: |
          set -euo pipefail
          if [[ -z "$AWS_DEPLOY_ROLE_ARN" ]]; then
            echo '::error::Set the AWS_DEPLOY_ROLE_ARN repository variable for the Free Tier account.'
            exit 1
          fi
      - name: Configure Free Tier deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
          allowed-account-ids: '781485979426'
          mask-aws-account-id: true
          unset-current-credentials: true
          retry-max-attempts: 2
      - name: Confirm source is still main and sync
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_MODE: ${{ inputs.mode || 'apply' }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT=$(git rev-parse HEAD)
          export SOURCE_COMMIT
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest" != "$SOURCE_COMMIT" ]]; then
            echo '::error::Main changed during preparation; rerun to sync its current catalog.'
            exit 1
          fi
          if [[ "$SYNC_MODE" == 'apply' ]]; then
            node scripts/sync-source-data.cjs --apply
          else
            node scripts/sync-source-data.cjs
          fi
