name: Package and deploy Auth Lambda

on:
  pull_request:
    paths:
      - 'backend/**'
      - '!backend/lambda/**'
      - '!backend/tests/**'
      - 'scripts/package-auth-lambda.py'
      - 'deploy/**'
      - '.github/workflows/lambda-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '!backend/lambda/**'
      - '!backend/tests/**'
      - 'scripts/package-auth-lambda.py'
      - 'deploy/**'
      - '.github/workflows/lambda-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Check syntax and package source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Package committed Python source (no test suite)
        run: |
          python -c "import ast; from pathlib import Path; ast.parse(Path('deploy/deploy-auth.py').read_text())"
          python scripts/package-auth-lambda.py "$RUNNER_TEMP/auth.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auth-${{ github.sha }}
          path: ${{ runner.temp }}/auth.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy CSTUHubAuth
    needs: package
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cstuhub-auth-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-2
      AWS_PAGER: ''
      AWS_CLI_AUTO_PROMPT: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: auth-${{ github.sha }}
          path: ${{ runner.temp }}/auth-package
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::781485979426:role/CSTUHubGitHubAuthDeployRole
          aws-region: ap-southeast-2
          allowed-account-ids: '781485979426'
          role-duration-seconds: 900
          retry-max-attempts: 3
          role-session-name: github-${{ github.run_id }}
      - name: Back up, deploy and verify code identity
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: python deploy/deploy-auth.py "$RUNNER_TEMP/auth-package/auth.zip" "$RELEASE_COMMIT"
