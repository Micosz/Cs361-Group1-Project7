name: Validate source catalog

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/partners.json'
      - 'data/source-sync-config.json'
      - 'public/data/partner-data-backup.json'
      - 'public/resources/**'
      - 'scripts/build-source-backup.cjs'
      - 'scripts/sync-source-data.cjs'
      - 'tests/source-sync.test.cjs'
      - '.github/workflows/update-data-backup.yml'
      - '.github/workflows/sync-source-data.yml'
  push:
    branches: [main]
    paths:
      - 'data/partners.json'
      - 'data/source-sync-config.json'
      - 'public/data/partner-data-backup.json'
      - 'public/resources/**'
      - 'scripts/build-source-backup.cjs'
      - 'scripts/sync-source-data.cjs'
      - 'tests/source-sync.test.cjs'
      - '.github/workflows/update-data-backup.yml'
      - '.github/workflows/sync-source-data.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build-source-backup.cjs --check
      - run: node --test tests/source-sync.test.cjs
